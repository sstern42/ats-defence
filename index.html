<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATS Defence</title>
    <meta
      name="description"
      content="A browser tower defence game where you play the applicant tracking system. Screen the applicants out before one of them reaches the vacancy."
    />
    <meta name="theme-color" content="#14161a" />
    <link rel="canonical" href="https://ats.spencerstern.com/" />

    <!-- The tab icon, drawn by tools/make-favicon.mjs. The SVG is the one a
         current browser takes, the PNG is for one that will not, and there is
         no .ico because a browser only goes looking for one when the page has
         declared no icon at all. The touch icon is a hundred and eighty pixels
         and square, since iOS masks its own corners on. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The game can be installed, and this is the half of it that is markup.
         The manifest carries the name, the icons and the colours a home screen
         and a splash screen are drawn with. The service worker is registered by
         the game rather than from here, in src/services/pwa.js, which is also
         where the two things the manifest deliberately does not say are
         written down.

         The two apple meta tags are for a version of iOS that reads neither the
         manifest's display mode nor its theme colour. A current one takes both
         from the manifest and ignores these, which is why the values match. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ATS Defence" />

    <!-- The launch happens on LinkedIn, so the card preview is the first thing
         most people will see of this. Absolute URLs, because a relative one is
         not resolved by the scrapers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ATS Defence" />
    <meta property="og:title" content="ATS Defence" />
    <meta
      property="og:description"
      content="A tower defence game where you are the applicant tracking system. Reject them before one of them reaches the vacancy and somebody has to read it properly."
    />
    <meta property="og:url" content="https://ats.spencerstern.com/" />
    <meta
      property="og:image"
      content="https://ats.spencerstern.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A tower defence board on an office floor, with screening towers placed either side of a corridor worn into the carpet and applicants walking down it towards a vacancy."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATS Defence" />
    <meta
      name="twitter:description"
      content="A tower defence game where you are the applicant tracking system. Reject them before one of them reaches the vacancy and somebody has to read it properly."
    />
    <meta
      name="twitter:image"
      content="https://ats.spencerstern.com/og-image.png"
    />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161a;
        /* There is nothing on this page to scroll to, so scrolling is only
           ever the page being dragged about by somebody trying to play. */
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* Phaser's autoCenter handles the centring itself, by setting margins on
         the canvas. Centring here as well would apply the offset twice. */
      #game {
        height: 100%;
      }

      /* The board reads its own pointers, so the browser is asked to keep its
         gestures off it. All three of these are the placement drag being taken
         away halfway through: a slide read as a scroll or a pinch, and a press
         and hold answered with the selection callout rather than a tower.

         Phaser ships a helper that sets touch-action and never calls it, and
         its own touch capture only reaches as far as preventDefault, which
         does not cover the callout. So it is set here.

         Scoped to the canvas rather than the page, so the message shown to
         anything too small for the game stays selectable. */
      #game canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Shown instead of the game on a screen it will not work on. Styled here
         rather than in the game, because the game is never started. */
      /*
       * The landscape refusal for the phone board. Fixed to the viewport rather
       * than drawn inside the canvas, because the canvas is the thing being
       * letterboxed when a portrait board is turned on its side, so anything
       * drawn in it ends up in the strip too.
       */
      .rotate-veil {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
        background: #14161a;
        font-family: system-ui, sans-serif;
      }

      .rotate-veil.showing {
        display: flex;
      }

      .rotate-veil h1 {
        margin: 0;
        font-size: 24px;
        color: #e6ebf0;
      }

      .rotate-veil p {
        margin: 0;
        max-width: 30rem;
        font-size: 15px;
        line-height: 1.5;
        color: #8b98a6;
      }

      .unsupported {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        padding: 32px;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #8b98a6;
      }

      .unsupported h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        color: #e6ebf0;
      }

      .unsupported p {
        margin: 0;
        max-width: 34ch;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
